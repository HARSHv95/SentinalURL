server:
  port: ${SERVER_PORT_SCAN}

spring:

  datasource:
    url: jdbc:postgresql://${POSTGRES_USER}:${POSTGRES_PORT}/${POSTGRES_SCAN}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

virustotal:
  api-key: ${VIRUSTOTAL_API_KEY}
  base-url: ${VIRUSTOTAL_API_URL}

urlhaus:
  auth-key: ${URLHAUS_AUTH_KEY:}
  base-url: https://urlhaus-api.abuse.ch/v1

openphish:
  feed-url: https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt

phishtank:
  app-key: ${PHISHTANK_APP_KEY:}
  base-url: https://checkurl.phishtank.com/checkurl

google-safe-browsing:
  api-key: ${GOOGLE_SAFE_BROWSING_API_KEY:}
  base-url: https://safebrowsing.googleapis.com

abuseipdb:
  api-key: ${ABUSEIPDB_API_KEY:}
  base-url: https://api.abuseipdb.com

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com
  model: ${OPENAI_MODEL:gpt-4o-mini}