server:
  port: ${SERVER_PORT_SCAN}

spring:

  datasource:
    url: jdbc:postgresql://${POSTGRES_USER}:${POSTGRES_PORT}/${POSTGRES_SCAN}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

virustotal:
  api-key: ${VIRUSTOTAL_API_KEY}
  base-url: ${VIRUSTOTAL_API_URL}

urlhaus:
  auth-key: ${URLHAUS_AUTH_KEY:}
  base-url: ${URLHAUS_BASE_URL}

openphish:
  feed-url: ${OPENPHISH_FEED_URL}

phishtank:
  app-key: ${PHISHTANK_APP_KEY:}
  base-url: ${PHISHTANK_BASE_URL}

google-safe-browsing:
  api-key: ${GOOGLE_SAFE_BROWSING_API_KEY:}
  base-url: ${GOOGLE_SAFE_BROWSING_BASE_URL}

abuseipdb:
  api-key: ${ABUSEIPDB_API_KEY:}
  base-url: ${ABUSEIPDB_BASE_URL}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_API_URL}
  model: ${OPENAI_MODEL:gpt-4o-mini}

gmail:
  client-id: ${GMAIL_CLIENT_ID}
  client-secret: ${GMAIL_CLIENT_SECRET}
  redirect-uri: ${GMAIL_REDIRECT_URI}
  auth-uri: ${GMAIL_AUTH_URI}
  token-uri: ${GMAIL_TOKEN_URI}
  api-base-url: ${GMAIL_API_BASE_URL}
  scope: ${GMAIL_SCOPE}
  frontend-success-url: ${GMAIL_FRONTEND_SUCCESS_URL}
  sync-interval-minutes: ${GMAIL_SYNC_INTERVAL_MINUTES:5}
  sync-lookback-hours: ${GMAIL_SYNC_LOOKBACK_HOURS:24}
  token-encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY}
  token-encryption-salt: ${GMAIL_TOKEN_ENCRYPTION_SALT}

watchlist:
  check-interval-hours: ${WATCHLIST_CHECK_INTERVAL_HOURS:6}
  ssl-expiry-warning-days: ${WATCHLIST_SSL_EXPIRY_WARNING_DAYS:14}

discord:
  application-id: ${DISCORD_APPLICATION_ID:}
  public-key: ${DISCORD_PUBLIC_KEY:}
  bot-token: ${DISCORD_BOT_TOKEN:}
  api-base-url: https://discord.com/api/v10
  test-guild-id: ${DISCORD_TEST_GUILD_ID:}